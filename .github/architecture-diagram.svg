<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtitle ddesc">
  <title id="dtitle">Arquitectura de crates de Zend X Chain</title>
  <desc id="ddesc">znx-node orquesta znx-consensus, znx-p2p y znx-wallet, todos sobre un workspace de Rust compartido.</desc>
  <rect width="900" height="480" fill="#0a0e17"/>

  <!-- znx-node (orchestrator) -->
  <rect x="330" y="30" width="240" height="60" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#f8fafc" font-weight="600">znx-node</text>
  <text x="450" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">binario principal / orquestador</text>

  <!-- lines down to 3 crates -->
  <line x1="450" y1="90" x2="450" y2="120" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="120" x2="740" y2="120" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="120" x2="450" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="120" x2="740" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- znx-consensus -->
  <rect x="40" y="150" width="240" height="70" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">znx-consensus</text>
  <text x="160" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">PoW, dificultad, subsidio/halving</text>

  <!-- znx-p2p -->
  <rect x="330" y="150" width="240" height="70" rx="8" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">znx-p2p</text>
  <text x="450" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">red P2P entre nodos</text>

  <!-- znx-wallet -->
  <rect x="620" y="150" width="240" height="70" rx="8" fill="none" stroke="#a855f7" stroke-width="2"/>
  <text x="740" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">znx-wallet</text>
  <text x="740" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">claves, transacciones, wallet CLI</text>

  <!-- lines down to storage/UTXO -->
  <line x1="160" y1="220" x2="160" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="450" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="220" x2="740" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="260" width="660" height="70" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="600">Almacenamiento UTXO + genesis devnet</text>
  <text x="450" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">formato de bloque/transacción compartido entre crates</text>

  <text x="450" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Workspace de Rust · cargo build --release -p znx-node -p znx-wallet-cli</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
