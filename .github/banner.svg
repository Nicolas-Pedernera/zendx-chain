<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zend X Chain — devnet</title>
  <desc id="desc">Blockchain PoW abierta con modelo UTXO, capa de consenso, red P2P y wallet, escrita en Rust.</desc>
  <rect width="1200" height="260" fill="#0a0e17"/>
  <g stroke="#1c2a3f" stroke-width="1">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>
  <!-- chain of blocks motif -->
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <rect x="60" y="95" width="70" height="70" rx="6"/>
    <rect x="160" y="95" width="70" height="70" rx="6"/>
    <rect x="260" y="95" width="70" height="70" rx="6"/>
    <rect x="360" y="95" width="70" height="70" rx="6" stroke="#3b82f6"/>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="130" y1="130" x2="160" y2="130"/>
    <line x1="230" y1="130" x2="260" y2="130"/>
    <line x1="330" y1="130" x2="360" y2="130"/>
  </g>
  <text x="480" y="115" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">Zend X Chain</text>
  <text x="480" y="150" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">devnet · PoW abierta + UTXO · Rust</text>
  <rect x="480" y="165" width="150" height="26" rx="13" fill="#3b1f0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="555" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fbbf24" font-weight="600">SIN VALOR REAL</text>
</svg>
