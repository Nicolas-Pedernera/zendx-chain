[package]
name = "znx-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
# Sin la feature `tls` (default de jsonrpsee-http-client): solo hablamos
# con znx-node en localhost por http:// texto plano, mismo criterio que
# znx-wallet-cli (evita compilar hyper-rustls/rustls sin necesidad).
jsonrpsee-core = { version = "0.26.0", features = ["client"] }
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
znx-crypto = { version = "0.1.0", path = "../znx-crypto" }
# Dependencia "real" solo para que Cargo construya el binario y exponga
# `CARGO_BIN_EXE_znx-node` en tiempo de compilación (ver doc de módulo) —
# znx-testkit no usa la API de Rust de znx-node, orquesta el binario.
znx-node = { version = "0.1.0", path = "../znx-node" }
