[package]
name = "znx-custody"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "znx-custody"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.3", features = ["derive", "env"] }
hex = "0.4.3"
jsonrpsee = { version = "0.26.0", features = ["server"] }
# Mismo cliente sin `tls` que usa znx-wallet — este proceso le habla a un
# znx-node en localhost/red privada, nunca por internet.
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
# Cliente distinto al de arriba a propósito: este sí habla por internet
# (polling saliente contra las Edge Functions de Supabase, ver
# docs/INTEGRATION.md) — rustls en vez de la TLS de OpenSSL para no sumar
# openssl-dev al Dockerfile.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
znx-crypto = { version = "0.1.0", path = "../znx-crypto" }
znx-wallet = { version = "0.1.0", path = "../znx-wallet" }

[dev-dependencies]
jsonrpsee-core = { version = "0.26.0", features = ["client"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "time"] }
znx-testkit = { version = "0.1.0", path = "../znx-testkit" }
