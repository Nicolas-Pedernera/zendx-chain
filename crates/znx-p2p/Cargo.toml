[package]
name = "znx-p2p"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
futures = "0.3"
libp2p = { version = "0.56.0", default-features = false, features = ["tcp", "noise", "yamux", "gossipsub", "request-response", "macros", "tokio"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
